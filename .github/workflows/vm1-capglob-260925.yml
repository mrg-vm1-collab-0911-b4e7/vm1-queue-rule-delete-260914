name: VM1 capglob runtime probe

on:
  pull_request:
    branches:
      - vm1-capglob-base-260925

jobs:
  upload-scope:
    if: ${{ !startsWith(github.head_ref, 'mergify/merge-queue/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: Mergifyio/gha-mergify-ci@v25
        with:
          action: scopes-upload
          scopes: '@acme/capglob'
          token: ${{ secrets.MERGIFY_TOKEN }}
          mergify_cli_version: latest

  queue-hold:
    if: ${{ startsWith(github.head_ref, 'mergify/merge-queue/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Hold speculative check
        run: sleep 300
