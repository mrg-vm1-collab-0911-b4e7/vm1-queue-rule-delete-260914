name: VM1 billing octocat author attribution probe
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  forge-author:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create controlled branch with octocat as commit author only
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B vm1-billing-octocat-author-probe
          printf 'VM1 billing octocat author attribution probe\n' > vm1-billing-octocat-author-probe.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vm1-billing-octocat-author-probe.txt
          GIT_AUTHOR_NAME='octocat' GIT_AUTHOR_EMAIL='583231+octocat@users.noreply.github.com' git commit -m 'test: controlled billing octocat author attribution probe'
          git push origin HEAD:refs/heads/vm1-billing-octocat-author-probe
