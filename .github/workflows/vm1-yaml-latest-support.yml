name: VM1 YAML Latest Resolver Support
on:
  workflow_dispatch:
    inputs:
      base_sha:
        required: true
      head_sha:
        required: true
permissions:
  contents: read
jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scopes
        uses: Mergifyio/gha-mergify-ci@v25
        with:
          action: scopes
          mergify_cli_version: latest
          base: ${{ inputs.base_sha }}
          head: ${{ inputs.head_sha }}
      - name: Show scopes
        run: echo 'SCOPES=${{ steps.scopes.outputs.scopes }}'
