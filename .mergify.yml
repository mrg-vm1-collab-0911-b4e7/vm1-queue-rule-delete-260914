scopes:
  source:
    manual:

pull_request_rules:
  - name: VM1_UNSELECTED_PUBLIC_LATENT_SCOPE_MERGE
    conditions:
      - base = main
      - title = VM1_UNSELECTED_PUBLIC_LATENT_SCOPE_PROBE
      - scope = vm1-unselected-public-poison
    actions:
      merge: {}

  - name: VM1 update-bot branch credential boundary
    conditions:
      - title ~= ^VM1_UPDATE_BOT_
      - "#commits-behind > 0"
    actions:
      update:
        bot_account: livastic-vm1-primary
