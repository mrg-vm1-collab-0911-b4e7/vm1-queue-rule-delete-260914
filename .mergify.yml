merge_queue:
  mode: parallel
  max_parallel_checks: 2

queue_rules:
  - name: vm1-resolver-auto-finalizer-261002
    queue_conditions:
      - label = vm1-resolver-auto-261002
    merge_conditions:
      - check-success = vm1-resolver-auto-ci
    batch_size: 2
    batch_max_wait_time: 1 minute
    merge_method: merge-batch
    conflict_resolvers:
      - paths:
          - resolver-auto-ci.txt
        strategy: prefer-theirs
