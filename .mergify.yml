scopes:
  source:
    manual:
  capacities:
    '@acme/*': 1

pull_request_rules:
  - name: VM1_UNSELECTED_PUBLIC_LATENT_SCOPE_MERGE
    conditions:
      - base = main
      - title = VM1_UNSELECTED_PUBLIC_LATENT_SCOPE_PROBE
      - scope = vm1-unselected-public-poison
    actions:
      merge: {}

  - name: VM1 strict WA direct stale-base discriminator
    conditions:
      - base = vm1-strict-wa-base3-260923
      - title = VM1_STRICT_WA_DIRECT3_260923
      - check-success = vm1-strict-wa-check3
    actions:
      merge:
        method: merge

merge_queue:
  mode: parallel
  max_parallel_checks: 2

queue_rules:
  - name: vm1-capglob-260925
    merge_method: squash
    batch_size: 1
    queue_conditions:
      - base = vm1-capglob-base-260925
      - title ~= ^VM1_CAPGLOB_[AB]_260925$
    merge_conditions:
      - check-success = queue-hold
      - check-success = vm1-capglob-never-260925
