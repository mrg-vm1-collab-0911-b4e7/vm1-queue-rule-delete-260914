scopes:
  source:
    manual:

pull_request_rules:
  - name: VM1_UNSELECTED_PUBLIC_LATENT_SCOPE_MERGE
    conditions:
      - base = main
      - title = VM1_UNSELECTED_PUBLIC_LATENT_SCOPE_PROBE
      - scope = vm1-unselected-public-poison
    actions:
      merge: {}

  - name: VM1 bot-account branch credential boundary
    conditions:
      - title ~= ^VM1_BOT_BRANCH_
    actions:
      merge:
        method: merge
        merge_bot_account: livastic-vm1-primary
