queue_rules:
  - name: vm1-delete-rule
    merge_method: merge-batch
    batch_size: 2
    batch_max_wait_time: 10 min
    checks_timeout: null
    allow_queue_branch_edit: false
    queue_conditions: []
    merge_conditions:
      - check-success = vm1-delete-policy-A

pull_request_rules:
  - name: VM1 queue-rule deletion fixture
    conditions:
      - base = vm1-delete-base
    actions:
      queue:
        name: vm1-delete-rule
