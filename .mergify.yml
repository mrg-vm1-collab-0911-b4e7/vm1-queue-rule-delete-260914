pull_request_rules:
  - name: VM1 post-check Jinja sandbox probe
    conditions:
      - title = VM1_POSTCHECK_JINJA_SANDBOX
    actions:
      post_check:
        title: "VM1PC SAFE={{ 7 * 7 }} MAP={{ [7] | map(attribute='__class__') | list }}"
        summary: "GROUP={{ [{'x': 1}] | groupby('__class__') | list }}"
